name: Build

on:
  push:
    branches:
      - main
      - master
      - release/*

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun lint
      - name: Format check
        run: bun fmt --check
      - name: Run Test
        run: bun test
